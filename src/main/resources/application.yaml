spring:
  application:
    name: fix-initiator

fix:
  initiator:
    heartbeat-interval-seconds: 30
    reconnect-interval-seconds: 5
    reset-store-on-start: false
    # Session configuration for connecting to FIX acceptor
    # The initiator will receive orders from the acceptor
    # 
    # To run with dev sessions: gradle bootRun --args='--spring.profiles.active=dev'
    # Or configure sessions here for production
    sessions:
      - host: 127.0.0.1
        port: 9878
        begin-string: FIX.4.4
        sender-comp-id: INITIATOR1
        target-comp-id: ACCEPTOR
      - host: 127.0.0.1
        port: 9878
        begin-string: FIX.4.4
        sender-comp-id: INITIATOR2
        target-comp-id: ACCEPTOR
