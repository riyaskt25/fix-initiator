spring:
  application:
    name: fix-initiator

fix:
  initiator:
    heartbeat-interval-seconds: 30
    reconnect-interval-seconds: 5
    sessions:
      - host: 127.0.0.1
        port: 9878
        begin-string: FIX.4.4
        sender-comp-id: INITIATOR1
        target-comp-id: ACCEPTOR
        send-interval-seconds: 10
        send-duration-minutes: 10
        symbol: DEMO
        quantity: 100
        side: BUY
      - host: 127.0.0.1
        port: 9878
        begin-string: FIX.4.4
        sender-comp-id: INITIATOR2
        target-comp-id: ACCEPTOR
        send-interval-seconds: 10
        send-duration-minutes: 10
        symbol: DEMO
        quantity: 100
        side: SELL
