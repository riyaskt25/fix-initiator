# FIX Initiator Session Configuration
# -------------------------------------------------------
# This file is the DEFAULT configuration bundled inside the jar.
# To override for a specific environment, place a custom initiator.cfg
# in the same directory as the running jar (or the project root when
# running with `gradlew bootRun`). The external file takes priority.
#
# Rules:
#   - No [DEFAULT] section — every property is explicit per [SESSION].
#   - DataDictionary: filename must match a file in src/main/resources/.
#     The app extracts it from the classpath to the given path automatically.
#   - FileStorePath / FileLogPath: directories are created by QuickFIX/J.
#   - Add, remove, or modify [SESSION] blocks freely — no code changes needed.
# -------------------------------------------------------

[SESSION]
ConnectionType=initiator
BeginString=FIX.4.4
SenderCompID=INITIATOR1
TargetCompID=ACCEPTOR
SocketConnectHost=127.0.0.1
SocketConnectPort=9878
HeartBtInt=30
ReconnectInterval=5
FileStorePath=fix-runtime/store
FileLogPath=fix-runtime/log
DataDictionary=dictionary/FIX44.xml
StartTime=00:00:00
EndTime=23:59:59
UseDataDictionary=Y

